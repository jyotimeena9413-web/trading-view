<title>Object Spotter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one column; picture on top, big readouts below, simple controls last. */
  :root {
    --bg:#f4f6f5; --panel:#ffffff; --fg:#14201b; --muted:#5b6b63; --line:#d5ddd9;
    --accent:#0b7a4b; --accent-fg:#ffffff; --warn:#a25b00; --area:#1f6fd6;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0e1512; --panel:#18221d; --fg:#e7efeb; --muted:#9bada4; --line:#2a3832;
    --accent:#3ddc84; --accent-fg:#06210f; --warn:#f0b24a; --area:#6aa8ff; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg:#0e1512; --panel:#18221d; --fg:#e7efeb; --muted:#9bada4; --line:#2a3832;
    --accent:#3ddc84; --accent-fg:#06210f; --warn:#f0b24a; --area:#6aa8ff; color-scheme: dark; }
  body { background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; margin:0;
    padding-block:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:24px; margin:0; letter-spacing:-0.01em; }
  #status { color:var(--muted); margin:0; min-height:1.4em; }
  #status.bad { color:var(--warn); }
  .stage { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:4/3; max-width:100%; }
  canvas { width:100%; height:100%; display:block; object-fit:contain; }
  video { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; }
  button, .filebtn, select { font:inherit; font-size:17px; padding:12px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--fg); min-height:48px; box-sizing:border-box; }
  button.primary, .filebtn.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; cursor:pointer; }
  .filebtn { display:inline-flex; align-items:center; cursor:pointer; }
  .filebtn input { display:none; }
  :focus-visible { outline:3px solid var(--area); outline-offset:2px; }
  .controls { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:12px; }
  label { display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--muted); min-width:0; }
  label select { color:var(--fg); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-width:0; }
  .stat b { display:block; font-size:34px; font-variant-numeric:tabular-nums; color:var(--accent); line-height:1.15; }
  .stat span { font-size:13px; color:var(--muted); }
  #list { color:var(--muted); margin:0; }
</style>

<div class="wrap">
  <h1>Object Spotter</h1>
  <p id="status">Loading the detector…</p>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>

  <div class="actions">
    <label class="filebtn primary" for="photo">Take a photo
      <input id="photo" type="file" accept="image/*" capture="environment">
    </label>
    <button id="live" type="button">Try live camera</button>
  </div>

  <div class="controls">
    <label for="style">Show objects as
      <select id="style">
        <option value="box">A. Green box</option>
        <option value="dot">B. Red dot</option>
      </select>
    </label>
    <label for="area">Area for density
      <select id="area">
        <option value="whole">Whole picture</option>
        <option value="left">Left half</option>
        <option value="right">Right half</option>
        <option value="top">Top half</option>
        <option value="bottom">Bottom half</option>
        <option value="center">Centre</option>
      </select>
    </label>
  </div>

  <div class="stats">
    <div class="stat"><b id="total">0</b><span>Objects detected</span></div>
    <div class="stat"><b id="inArea">0</b><span>Objects inside the chosen area</span></div>
    <div class="stat"><b id="density">0.00</b><span>Density: objects per 100×100 pixel block</span></div>
    <div class="stat"><b id="cover">0%</b><span>Share of the chosen area covered by objects</span></div>
  </div>
  <p id="list"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d');
let model = null, mode = 'none', still = null, lastPreds = [], running = false;

function say(t, bad) { $('status').textContent = t; $('status').className = bad ? 'bad' : ''; }

function areaRect(kind, w, h) {
  switch (kind) {
    case 'left':   return {x:0, y:0, w:w/2, h:h};
    case 'right':  return {x:w/2, y:0, w:w/2, h:h};
    case 'top':    return {x:0, y:0, w:w, h:h/2};
    case 'bottom': return {x:0, y:h/2, w:w, h:h/2};
    case 'center': return {x:w/4, y:h/4, w:w/2, h:h/2};
    default:       return {x:0, y:0, w:w, h:h};
  }
}
function overlap(b, r) {
  const x1 = Math.max(b[0], r.x), y1 = Math.max(b[1], r.y);
  const x2 = Math.min(b[0]+b[2], r.x+r.w), y2 = Math.min(b[1]+b[3], r.y+r.h);
  return Math.max(0, x2-x1) * Math.max(0, y2-y1);
}

// Draw the current picture plus the detections and update the numbers.
function render(source, preds) {
  const W = canvas.width, H = canvas.height;
  ctx.drawImage(source, 0, 0, W, H);
  const style = $('style').value, rect = areaRect($('area').value, W, H);
  const sz = Math.max(2, W / 320);

  ctx.setLineDash([sz*4, sz*3]); ctx.strokeStyle = '#4aa8ff'; ctx.lineWidth = sz;
  ctx.strokeRect(rect.x, rect.y, rect.w, rect.h); ctx.setLineDash([]);

  let inArea = 0, covered = 0; const counts = {};
  for (const p of preds) {
    const [x, y, w, h] = p.bbox, cx = x + w/2, cy = y + h/2;
    counts[p.class] = (counts[p.class] || 0) + 1;
    if (cx >= rect.x && cx <= rect.x+rect.w && cy >= rect.y && cy <= rect.y+rect.h) inArea++;
    covered += overlap(p.bbox, rect);
    if (style === 'box') {
      ctx.strokeStyle = '#00e050'; ctx.lineWidth = sz*1.5; ctx.strokeRect(x, y, w, h);
      const fs = Math.round(W / 40); ctx.font = fs + 'px Arial';
      const label = p.class + ' ' + Math.round(p.score*100) + '%';
      const tw = ctx.measureText(label).width + 8;
      ctx.fillStyle = '#00e050'; ctx.fillRect(x, Math.max(0, y - fs - 6), tw, fs + 6);
      ctx.fillStyle = '#000'; ctx.fillText(label, x + 4, Math.max(fs, y - 6));
    } else {
      ctx.fillStyle = '#ff2020'; ctx.beginPath(); ctx.arc(cx, cy, sz*4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = sz; ctx.stroke();
    }
  }
  const areaPx = rect.w * rect.h;
  $('total').textContent = preds.length;
  $('inArea').textContent = inArea;
  $('density').textContent = (inArea / (areaPx / 10000)).toFixed(2);
  $('cover').textContent = Math.min(100, Math.round(covered / areaPx * 100)) + '%';
  $('list').textContent = preds.length
    ? 'Seen: ' + Object.entries(counts).map(([k, v]) => v + ' × ' + k).join(', ')
    : 'No objects found.';
}

async function detectStill(img, w, h) {
  if (!model) { say('The detector is still loading. Try again in a moment.', true); return; }
  canvas.width = w; canvas.height = h;
  say('Looking for objects…');
  ctx.drawImage(img, 0, 0, w, h);
  lastPreds = (await model.detect(canvas, 50)).filter(p => p.score > 0.5);
  render(img, lastPreds);
  say('Done. Tap "Take a photo" to try another.');
}

$('photo').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  running = false; mode = 'photo';
  try {
    const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
    const scale = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    still = bmp;
    await detectStill(bmp, Math.round(bmp.width*scale), Math.round(bmp.height*scale));
  } catch (err) { say('Could not read that photo. Please try again.', true); }
  e.target.value = '';
});

async function liveLoop() {
  if (!running) return;
  if (video.readyState >= 2) {
    const preds = (await model.detect(video, 50)).filter(p => p.score > 0.5);
    lastPreds = preds; render(video, preds);
  }
  requestAnimationFrame(liveLoop);
}

$('live').addEventListener('click', async () => {
  if (!model) { say('The detector is still loading. Try again in a moment.', true); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream; await video.play();
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    mode = 'live'; running = true; say('Live camera on.'); liveLoop();
  } catch (e) {
    say('Live camera is blocked inside this page. Use "Take a photo" instead, it opens your camera and checks the picture.', true);
  }
});

// Changing a setting redraws the last photo straight away.
['style', 'area'].forEach(id => $(id).addEventListener('change', () => {
  if (mode === 'photo' && still) render(still, lastPreds);
}));

// Placeholder frame so the page is not empty before the first photo.
ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#9bada4'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
ctx.fillText('Tap "Take a photo" to begin', canvas.width/2, canvas.height/2); ctx.textAlign = 'left';

(async () => {
  try {
    model = await cocoSsd.load({ modelUrl: 'model/model.json' });
    say('Ready. Tap "Take a photo" to find objects.');
  } catch (e) {
    say('The detector could not load. Please refresh the page.', true);
  }
})();
</script>
