<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little Scientists">
<title>Little Scientists</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<style>
/* Layout: one full-screen app. Big colourful home tiles, each opening a full-screen touch activity. No reading needed: voice, sound and motion carry everything. */
:root{
  --sky:#d6f1ff; --ink:#22305c; --paper:#ffffff;
  --coral:#ff6b5e; --sun:#ffc93c; --leaf:#34c47c; --grape:#8b6cff; --ocean:#2f9bff; --pink:#ff7eb6;
  --font:'Fredoka','Noto Sans Devanagari','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky);color:var(--ink);font-family:var(--font);touch-action:manipulation;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:10px}
.bar{display:flex;align-items:center;gap:12px}
.bar h1{flex:1;margin:0;text-align:center;font-size:clamp(24px,5vmin,44px);font-weight:700;letter-spacing:.5px}
.round{width:clamp(56px,9vmin,84px);height:clamp(56px,9vmin,84px);border-radius:50%;background:var(--paper);font-size:clamp(28px,5vmin,44px);box-shadow:0 5px 0 rgba(34,48,92,.18);display:grid;place-items:center;flex:none}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(34,48,92,.18)}
.right{display:flex;align-items:center;gap:10px}
#stars{background:var(--paper);border-radius:99px;padding:8px 16px;font-weight:600;font-size:clamp(20px,3.6vmin,32px);box-shadow:0 5px 0 rgba(34,48,92,.18);font-variant-numeric:tabular-nums}
#view{flex:1;min-height:0;position:relative}
#caption{min-height:2.2em;text-align:center;font-size:clamp(20px,3.6vmin,34px);font-weight:600;padding:0 8px;display:flex;align-items:center;justify-content:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.bit{position:absolute;font-size:clamp(28px,6vmin,56px);animation:fly 1.3s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}

/* start overlay */
#start{position:fixed;inset:0;z-index:100;background:var(--sky);display:grid;place-items:center;align-content:center;gap:18px;text-align:center}
#start h2{margin:0;font-size:clamp(40px,9vmin,90px)}
#start .row{display:flex;gap:clamp(14px,3vmin,34px);flex-wrap:wrap;justify-content:center;padding:0 16px}
#start button{border-radius:44px;padding:clamp(16px,4vmin,40px) clamp(26px,7vmin,80px);background:var(--coral);color:#fff;font-size:clamp(34px,8vmin,80px);font-weight:700;box-shadow:0 12px 0 rgba(34,48,92,.25);animation:pulse 1.4s ease-in-out infinite}
#start button+button{background:var(--leaf);animation-delay:-.7s}
@keyframes pulse{50%{transform:scale(1.07)}}

/* home */
.home{height:100%;display:grid;gap:clamp(12px,2.4vmin,26px);grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));grid-auto-rows:1fr;padding-bottom:6px;overflow:auto}
.tile{border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:700;font-size:clamp(24px,4.6vmin,44px);box-shadow:0 9px 0 rgba(34,48,92,.22);min-height:150px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.tile:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(34,48,92,.22)}
.tile .em{font-size:clamp(64px,15vmin,150px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12));animation:bob 3s ease-in-out infinite}
.tile:nth-child(2n) .em{animation-delay:-1s}.tile:nth-child(3n) .em{animation-delay:-2s}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}

/* quiz */
.stagebox{height:100%;border-radius:34px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 9px 0 rgba(34,48,92,.15);position:relative}
.big{font-size:clamp(110px,32vmin,320px);line-height:1;animation:bounce 1.6s ease-in-out infinite;cursor:pointer}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3vmin) scale(1.05)}}
.nm{font-size:clamp(30px,6vmin,60px);font-weight:700}
.magic{position:absolute;top:14px;right:14px;background:var(--grape);color:#fff;border-radius:99px;padding:12px 22px;font-size:clamp(20px,3.6vmin,34px);font-weight:700;box-shadow:0 5px 0 rgba(34,48,92,.22)}
.modal{position:absolute;inset:0;background:rgba(34,48,92,.5);border-radius:34px;display:grid;place-items:center;padding:12px;z-index:5;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{background:var(--paper);border-radius:36px;padding:clamp(14px,3vmin,30px);width:min(100%,900px);max-height:100%;overflow:auto;text-align:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1);box-shadow:0 12px 0 rgba(0,0,0,.18)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.card h2{margin:0 0 12px;font-size:clamp(26px,5.4vmin,52px)}
.choices{display:flex;gap:clamp(10px,2vmin,22px);justify-content:center;flex-wrap:wrap}
.choice{flex:1 1 150px;max-width:260px;border-radius:30px;padding:clamp(12px,2.6vmin,26px) 10px;color:#fff;font-weight:700;font-size:clamp(24px,4.6vmin,44px);display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 8px 0 rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(0,0,0,.12)}
.choice:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.choice .em{font-size:clamp(56px,13vmin,120px);line-height:1}
.choice small{font-size:.5em;font-weight:400;opacity:.95}
.choice.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.answer .em{font-size:clamp(90px,24vmin,220px);line-height:1;display:block;animation:bounce 1.2s ease-in-out infinite}
.answer p{font-size:clamp(24px,4.6vmin,44px);margin:6px 0 14px;font-weight:600}
.next{background:var(--leaf);color:#fff;border-radius:99px;padding:14px 44px;font-size:clamp(34px,7vmin,64px);font-weight:700;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.next:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.2)}

/* magic states */
.thermo{width:clamp(30px,5vmin,50px);height:50%;background:#e8eefc;border-radius:99px;position:absolute;left:5%;top:25%;overflow:hidden;border:5px solid var(--ink)}
.thermo i{position:absolute;left:0;right:0;bottom:0;background:var(--coral);transition:height 1s;border-radius:99px}
.hint{font-size:clamp(24px,4.6vmin,44px);font-weight:700;color:var(--ink)}
.go{background:var(--coral);color:#fff;border-radius:99px;padding:12px 34px;font-size:clamp(26px,5vmin,48px);font-weight:700;box-shadow:0 7px 0 rgba(0,0,0,.2);margin-top:8px}
.go:active{transform:translateY(4px)}
.morph{animation:morph .8s}
@keyframes morph{0%{transform:scale(1)}40%{transform:scale(.4) rotate(-20deg)}100%{transform:scale(1)}}

/* float or sink */
.fs{height:100%;display:flex;flex-direction:column;gap:10px}
.shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--paper);border-radius:28px;padding:10px;box-shadow:0 7px 0 rgba(34,48,92,.15);position:relative;z-index:3}
.slot{width:clamp(70px,14vmin,130px);height:clamp(70px,14vmin,130px);border-radius:22px;background:#eef4ff;display:grid;place-items:center;position:relative}
.it{font-size:clamp(52px,11vmin,100px);line-height:1;touch-action:none;cursor:grab;position:relative;z-index:4;width:1.15em;height:1.15em;display:grid;place-items:center}
.it.drag{z-index:30;filter:drop-shadow(0 12px 8px rgba(0,0,0,.25))}
.tub{flex:1;min-height:0;position:relative;border-radius:34px;overflow:hidden;background:linear-gradient(#fdf3d8,#fff6e0);box-shadow:0 9px 0 rgba(34,48,92,.15)}
.water{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(rgba(70,170,255,.78),rgba(20,110,230,.9));z-index:2;pointer-events:none}
.water::before{content:"";position:absolute;left:-10%;right:-10%;top:-14px;height:28px;background:radial-gradient(circle at 20px 28px,rgba(70,170,255,.78) 18px,transparent 19px) 0 0/40px 28px repeat-x;animation:wave 2.4s linear infinite}
@keyframes wave{to{background-position:40px 0}}
.tub .it{position:absolute;z-index:1}
.tub .it.in{transition:left .45s ease-out,top .45s ease-out;cursor:default}
.tub .it.sink{transition:left .45s ease-out,top 1.7s cubic-bezier(.4,0,.8,.6)}
.tub .it.swim{z-index:3;animation:swim 2s ease-in-out infinite;transition:left .45s ease-out,top .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes swim{50%{transform:translateY(8px) rotate(5deg)}}
.hintbar{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:700;font-size:clamp(20px,3.8vmin,36px);z-index:1;color:#9a7a2a}

/* colours */
.mix{height:100%;border-radius:34px;background:var(--paper);box-shadow:0 9px 0 rgba(34,48,92,.15);display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:10px}
.bowl{width:clamp(180px,42vmin,420px);aspect-ratio:1;border-radius:50%;background:#f1f3f9;border:10px solid #c9d1e6;position:relative;overflow:hidden;display:grid;place-items:center;cursor:pointer}
.blob{width:70%;aspect-ratio:1;border-radius:50%;transition:background .6s,transform .5s}
.blob.swirl{background:conic-gradient(var(--a),var(--b),var(--a),var(--b),var(--a))!important;animation:spin 1.1s linear}
@keyframes spin{to{transform:rotate(540deg) scale(1.1)}}
.pots{display:flex;gap:clamp(14px,4vmin,50px)}
.pot{width:clamp(84px,18vmin,170px);aspect-ratio:1;border-radius:50% 50% 38% 38%;box-shadow:0 8px 0 rgba(0,0,0,.2),inset 0 -10px 0 rgba(0,0,0,.12)}
.pot:active{transform:translateY(5px) scale(.96)}
.pot.drip{animation:shake .4s}

/* scenes */
.scene{height:100%;border-radius:34px;position:relative;overflow:hidden;box-shadow:0 9px 0 rgba(34,48,92,.15)}
.sky{position:absolute;inset:0;transition:opacity 1.6s}
.sky.d{background:linear-gradient(#6fd0ff,#c9f0ff 70%)}
.sky.n{background:linear-gradient(#0f1b4a,#2d3b8a 75%);opacity:0}
.scene.night .sky.n{opacity:1}
.orb{position:absolute;font-size:clamp(90px,24vmin,230px);line-height:1;left:50%;margin-left:-.5em;transition:transform 1.8s cubic-bezier(.5,0,.3,1),opacity 1.4s;cursor:pointer;z-index:3}
.orb.sunb{top:8%;animation:spinslow 24s linear infinite}
.orb.moonb{top:8%;transform:translateY(150%);opacity:0}
.scene.night .sunb{transform:translateY(160%);opacity:0}
.scene.night .moonb{transform:translateY(0);opacity:1}
@keyframes spinslow{to{rotate:360deg}}
.starl{position:absolute;inset:0 0 40% 0;opacity:0;transition:opacity 1.6s;z-index:1}
.scene.night .starl{opacity:1}
.starl span{position:absolute;font-size:clamp(18px,4vmin,40px);animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.3;transform:scale(.7)}}
.hill{position:absolute;left:-10%;right:-10%;bottom:-20%;height:42%;border-radius:50% 50% 0 0;background:#4dc66f;z-index:2;transition:background 1.6s}
.hill.h2{left:30%;right:-40%;bottom:-24%;height:36%;background:#38b45c}
.scene.night .hill{background:#1f6a45}.scene.night .hill.h2{background:#185a3a}
.crit{position:absolute;bottom:14%;font-size:clamp(60px,14vmin,140px);z-index:4;cursor:pointer;line-height:1;transition:opacity 1s}
.crit.day{left:12%}.crit.nite{right:12%;opacity:0;pointer-events:none}
.scene.night .crit.day{opacity:0;pointer-events:none}.scene.night .crit.nite{opacity:1;pointer-events:auto}
.crit.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-6vmin) rotate(-8deg)}}
.togl{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:6;background:var(--paper);border-radius:99px;padding:12px 32px;font-size:clamp(26px,5vmin,48px);font-weight:700;box-shadow:0 7px 0 rgba(0,0,0,.2);white-space:nowrap}
.togl:active{transform:translateX(-50%) translateY(4px)}

.wx{background:linear-gradient(#6fd0ff,#c9f0ff)}
.wx.m-rainy{background:linear-gradient(#6b7a96,#aab6c9)}
.wx.m-snowy{background:linear-gradient(#b9c6dd,#eef3fb)}
.wx.m-windy{background:linear-gradient(#8fcfe8,#d8f1f6)}
.wx canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3}
.cl{position:absolute;font-size:clamp(90px,22vmin,220px);line-height:1;opacity:0;transition:opacity 1s;z-index:2;animation:drift 12s ease-in-out infinite alternate}
.m-rainy .cl,.m-snowy .cl,.m-windy .cl{opacity:1}
.m-rainy .cl{filter:grayscale(1) brightness(.75)}
@keyframes drift{from{transform:translateX(-4vw)}to{transform:translateX(4vw)}}
.wsun{position:absolute;top:6%;left:50%;margin-left:-.5em;font-size:clamp(110px,28vmin,270px);line-height:1;transition:opacity 1s;z-index:2;animation:spinslow 20s linear infinite}
.wx:not(.m-sunny) .wsun{opacity:0}
.wbtns{position:absolute;bottom:12px;left:0;right:0;display:flex;gap:clamp(8px,2vmin,20px);justify-content:center;z-index:6;padding:0 8px}
.wb{background:var(--paper);border-radius:28px;padding:8px clamp(14px,3vmin,34px);font-size:clamp(40px,9vmin,84px);line-height:1.1;box-shadow:0 7px 0 rgba(0,0,0,.2)}
.wb.on{background:var(--sun)}
.wb:active{transform:translateY(4px)}
.done{display:grid;place-items:center;height:100%;text-align:center;gap:10px;align-content:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
#lang{font-size:clamp(20px,3.6vmin,32px);font-weight:700}
#caption{gap:12px}
#buddy{font-size:clamp(40px,7vmin,64px);line-height:1;display:inline-block;flex:none}
#buddy.talk{animation:talk .35s ease-in-out infinite alternate}
@keyframes talk{from{transform:translateY(0) rotate(-6deg) scale(1)}to{transform:translateY(-8px) rotate(6deg) scale(1.12)}}
#vpanel{position:fixed;inset:0;z-index:80;background:rgba(34,48,92,.5);display:grid;place-items:center;padding:16px}
#vpanel .card{max-height:90%}
.vrow,.vlist{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:16px}
.vbtn{background:#eef4ff;border-radius:24px;padding:10px 22px;font-size:clamp(30px,6vmin,52px);box-shadow:0 5px 0 rgba(34,48,92,.15)}
.vbtn.wide{font-size:clamp(20px,3.4vmin,30px);font-weight:600}
.vbtn small{font-size:.65em;opacity:.7}
.vbtn.on{background:var(--sun)}
</style>

<div id="app">
  <header class="bar">
    <button class="round" id="back" aria-label="Home" hidden>🏠</button>
    <h1 id="ttl">Little Scientists</h1>
    <div class="right">
      <button class="round" id="voice" aria-label="Voice">🎙️</button>
      <button class="round" id="lang" aria-label="Language">हिं</button>
      <button class="round" id="again" aria-label="Hear again" hidden>🗣️</button>
      <span id="stars">⭐ 0</span>
      <button class="round" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
  </header>
  <main id="view"></main>
  <div id="caption"><span id="buddy" aria-hidden="true">🦄</span><span id="captxt" aria-live="polite"></span></div>
</div>
<div id="fx"></div>
<div id="start"><h2>Little Scientists · छोटे वैज्ञानिक</h2><div class="row"><button id="go-en">▶ English</button><button id="go-hi">▶ हिन्दी</button></div></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rnd(a,b){return a+Math.random()*(b-a)}

/* ---------- language: [English, Hindi] pairs ---------- */
var LANG='en';
try{LANG=localStorage.getItem('ls_lang')==='hi'?'hi':'en'}catch(e){}
function H(){return LANG==='hi'}
function tx(x){return Array.isArray(x)?(H()?x[1]:x[0]):x}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
var YAY={en:['Yay! ','Wow! ','Hooray! ','Super! '],hi:['याय! ','वाह! ','शाबाश! ','बहुत बढ़िया! ']};
var OOPS=['Oh oh! Try again! You can do it!','अरे! फिर से कोशिश करो! तुम कर सकते हो!'];

/* ---------- audio ---------- */
var muted=false,AC=null,NB=null;
function ac(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C){try{AC=new C()}catch(e){}}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function tone(f,d,type,v,delay,slide){
  if(muted)return;var a=ac();if(!a)return;
  var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
function noiseBuf(){
  var a=ac();if(!a)return null;
  if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  return NB;
}
function burst(d,v,freq,delay,type){
  if(muted)return;var a=ac();if(!a)return;var b=noiseBuf();if(!b)return;
  var t=a.currentTime+(delay||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=b;f.type=type||'lowpass';f.frequency.value=freq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.05);
}
var sfx={
  tap:function(){tone(660,.1,'sine',.15,0,990)},
  good:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.35,'triangle',.22,i*.11)})},
  bad:function(){tone(260,.22,'sine',.2,0,180);tone(220,.3,'sine',.2,.22,150)},
  splash:function(){burst(.6,.5,1800,0,'lowpass');tone(500,.2,'sine',.1,0,200)},
  pour:function(){burst(.7,.25,900,0,'bandpass');tone(800,.2,'sine',.1,.5,400)},
  chirp:function(){for(var i=0;i<3;i++)tone(2300+i*200,.08,'sine',.1,i*.12,3200)},
  hoot:function(){tone(340,.3,'sine',.3,0,300);tone(300,.5,'sine',.3,.4,260)},
  whoosh:function(){burst(.9,.35,700,0,'bandpass')},
  sizzle:function(){burst(1,.2,5000,0,'highpass')},
  freeze:function(){tone(1500,.5,'triangle',.12,0,500)}
};
function ambient(kind){
  if(muted)return function(){};
  var a=ac();if(!a)return function(){};var b=noiseBuf();if(!b)return function(){};
  var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=b;s.loop=true;
  var lfo=null;
  if(kind==='rain'){f.type='highpass';f.frequency.value=1500;g.gain.value=.09}
  else{f.type='lowpass';f.frequency.value=600;g.gain.value=.12;
    lfo=a.createOscillator();var lg=a.createGain();lfo.frequency.value=.3;lg.gain.value=.08;lfo.connect(lg);lg.connect(g.gain);lfo.start()}
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();
  return function(){try{g.gain.setTargetAtTime(0,a.currentTime,.1);s.stop(a.currentTime+.5);if(lfo)lfo.stop(a.currentTime+.5)}catch(e){}};

/* ---------- voice + caption ---------- */

    b.addEventListener('pointermove',function(ev){if(!down)return;var dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.hypot(dx,dy)>8)moved=true;b.style.transform='translate('+dx+'px,'+dy+'px) scale(1.15)'});
    function end(ev){
      if(!down)return;down=false;b.classList.remove('drag');
      var tr=tub.getBoundingClientRect(),inTub=moved&&ev.clientY>tr.top&&ev.clientX>tr.left&&ev.clientX<tr.right;
      if(!moved||inTub){drop(b,it,inTub?ev.clientX-tr.left:null)}else{b.style.transform=''}
    }
    b.addEventListener('pointerup',end);b.addEventListener('pointercancel',function(){down=false;b.classList.remove('drag');b.style.transform=''});
  });
  function drop(b,it,x){
    var tr=tub.getBoundingClientRect(),ir=b.getBoundingClientRect();
    var size=ir.width/1.15;
    b.style.transform='';tub.appendChild(b);b.classList.add('in');
    b.style.left=(ir.left-tr.left)+'px';b.style.top=(ir.top-tr.top)+'px';
    void b.offsetWidth;
    var tx2=x==null?rnd(tr.width*.1,tr.width*.8):Math.max(4,Math.min(tr.width-size*1.2,x-size*.6));
    var waterTop=tr.height*.38;
    b.style.left=tx2+'px';
    setTimeout(function(){
      sfx.splash();hint.style.display='none';
      if(it.f){b.classList.add('swim');b.style.top=(waterTop-size*.55)+'px'}
      else{b.classList.add('sink');b.style.top=(tr.height-size*1.25-rnd(0,10))+'px'}
      say(result(it));replay=function(){say(result(it))};
      left--;
      if(left===0)setTimeout(finish,2400);
    },450);
  }
  function finish(){
    if(!wrap.isConnected)return;
    celebrate();
    var msg=tx(['Hooray! Great job! Some things float, and some things sink!','शाबाश! कुछ चीज़ें तैरती हैं, और कुछ डूब जाती हैं!']);
    say(msg);
    var d=el('div','modal'),c=el('div','card answer','<span class="em">🎉</span><p>'+msg+'</p>');
    var nx=el('button','next','🔄');nx.setAttribute('aria-label','Play again');
    nx.onclick=function(){sfx.tap();root.innerHTML='';ACTS.floatsink.run(root)};
    c.appendChild(nx);d.appendChild(c);wrap.style.position='relative';tub.appendChild(d);d.style.zIndex=20;
  }
}};

ACTS.colors={title:['Mix Colors','रंग मिलाओ'],run:function(root){
  var C={red:{c:'#ff3b3b',n:['Red','लाल']},yellow:{c:'#ffd400',n:['Yellow','पीला']},blue:{c:'#2b6cff',n:['Blue','नीला']}};
  var R={'red+yellow':[['Orange','नारंगी'],'#ff8a1f'],'blue+yellow':[['Green','हरा'],'#2fbf4a'],'blue+red':[['Purple','बैंगनी'],'#8b3fd6']};
  var box=el('div','mix'),bowl=el('div','bowl'),blob=el('div','blob'),pots=el('div','pots');
  blob.style.background='transparent';bowl.appendChild(blob);box.append(bowl,pots);root.appendChild(box);
  var first=null,busy=false;
  var intro=tx(['Pick two colors to mix! Touch a paint pot.','दो रंग चुनो और मिलाओ! रंग के डिब्बे को छुओ।']);
  say(intro);replay=function(){say(intro)};
  Object.keys(C).forEach(function(k){
    var p=el('button','pot');p.style.background=C[k].c;p.setAttribute('aria-label',C[k].n[0]);
    p.onclick=function(){
      if(busy)return;
      p.classList.remove('drip');void p.offsetWidth;p.classList.add('drip');sfx.pour();
      var nk=tx(C[k].n);
      if(!first){first=k;blob.style.background=C[k].c;blob.style.transform='scale(.7)';setTimeout(function(){blob.style.transform='scale(1)'},30);
        say(H()?nk+'! अब दूसरा रंग चुनो।':nk+'! Now pick another color.')}
      else if(first===k){say(H()?'यह तो अभी भी '+nk+' है! दूसरा रंग चुनो।':'That is still '+nk+'! Pick a different color.')}
      else{
        busy=true;var key=[first,k].sort().join('+'),res=R[key],a=C[first].c,b=C[k].c,n1=tx(C[first].n);
        blob.style.setProperty('--a',a);blob.style.setProperty('--b',b);blob.classList.add('swirl');
        say(n1+(H()?' और ':' and ')+nk+'...');
        setTimeout(function(){
          blob.classList.remove('swirl');blob.style.background=res[1];
          var t=H()?'वाह! '+n1+' और '+nk+' मिलकर '+tx(res[0])+' बनते हैं!':'Wow! '+n1+' and '+nk+' make '+tx(res[0])+'!';
          say(t);replay=function(){say(t)};celebrate(bowl);
          first=null;busy=false;
        },1200);
      }
    };
    pots.appendChild(p)});
  bowl.onclick=function(){if(busy)return;sfx.tap();first=null;blob.style.background='transparent';say(intro);replay=function(){say(intro)}};
}};

ACTS.daynight={title:['Day and Night','दिन और रात'],run:function(root){
  var sc=el('div','scene'),night=false;
  var stars='';for(var i=0;i<14;i++)stars+='<span style="left:'+rnd(3,92).toFixed(1)+'%;top:'+rnd(2,80).toFixed(1)+'%;animation-delay:'+rnd(0,2).toFixed(1)+'s">⭐</span>';
  sc.innerHTML='<div class="sky d"></div><div class="sky n"></div><div class="starl">'+stars+'</div>'+
    '<div class="orb sunb">☀️</div><div class="orb moonb">🌙</div><div class="hill"></div><div class="hill h2"></div>'+
    '<div class="crit day">🐦</div><div class="crit nite">🦉</div>';
  var tg=el('button','togl',tx(['🌙 Night','🌙 रात']));sc.appendChild(tg);root.appendChild(sc);
  function msg(){return night?tx(['It is night. The moon and the stars come out. The owl says hoot!','अब रात है। चाँद और तारे निकल आए। उल्लू बोला, हू हू!']):tx(['It is day. The sun is up. The bird says tweet!','अब दिन है। सूरज निकल आया। चिड़िया बोली, चीं चीं!'])}
  function flip(){night=!night;sc.classList.toggle('night',night);tg.textContent=night?tx(['☀️ Day','☀️ दिन']):tx(['🌙 Night','🌙 रात']);sfx.whoosh();
    setTimeout(function(){say(msg());night?sfx.hoot():sfx.chirp()},700)}
  tg.onclick=flip;
  sc.querySelectorAll('.orb').forEach(function(o){o.onclick=flip});
  sc.querySelectorAll('.crit').forEach(function(c){c.onclick=function(){c.classList.remove('hop');void c.offsetWidth;c.classList.add('hop');
    if(c.classList.contains('day')){sfx.chirp();say(tx(['Tweet tweet! Birds sing in the day!','चीं चीं! चिड़िया दिन में गाती है!']))}
    else{sfx.hoot();say(tx(['Hoot hoot! Owls wake up at night!','हू हू! उल्लू रात को जागता है!']))}}});
  var intro=tx(['Touch the sun or the moon to change the sky!','सूरज या चाँद को छुओ, आसमान बदल जाएगा!']);
  say(intro);replay=function(){say(msg())};
}};

ACTS.weather={title:['Weather','मौसम'],run:function(root){
  var sc=el('div','scene wx m-sunny'),cv=el('canvas');
  sc.innerHTML='<div class="wsun">☀️</div><div class="cl" style="top:4%;left:6%">☁️</div><div class="cl" style="top:12%;right:8%;animation-delay:-4s">☁️</div><div class="cl" style="top:2%;left:42%;animation-delay:-8s">☁️</div>';
  sc.appendChild(cv);
  var M=[['sunny','☀️',['It is sunny! The sun is bright and warm.','धूप निकली है! सूरज चमक रहा है।']],
         ['rainy','🌧️',['It is raining! Rain falls from the clouds.','बारिश हो रही है! बादलों से पानी गिरता है, टप टप!']],
         ['snowy','❄️',['It is snowing! Snow is frozen water. Brrr!','बर्फ़ गिर रही है! बर्फ़ जमा हुआ पानी है। ब्रर्र!']],
         ['windy','💨',['It is windy! The wind blows the leaves.','हवा चल रही है! हवा पत्तों को उड़ाती है, सूं सूं!']]];
  var bar=el('div','wbtns'),mode='sunny',btns={};
  M.forEach(function(m){var b=el('button','wb'+(m[0]==='sunny'?' on':''),m[1]);b.setAttribute('aria-label',m[0]);b.onclick=function(){set(m[0],true)};btns[m[0]]=b;bar.appendChild(b)});
  sc.appendChild(bar);root.appendChild(sc);
  var ctx=cv.getContext('2d'),W=0,H2=0,dpr=1,parts=[],raf=0,stopAmb=function(){},timer=0;
  function resize(){var r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;W=r.width;H2=r.height;seed()}
  function seed(){var n={rainy:130,snowy:70,windy:16}[mode]||0;parts=[];for(var i=0;i<n;i++)parts.push({x:Math.random()*W,y:Math.random()*H2,s:rnd(.6,1.3),p:Math.random()*6})}
  var t=0;
  function frame(){
    raf=requestAnimationFrame(frame);t+=.03;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H2);
    parts.forEach(function(p){
      if(mode==='rainy'){ctx.strokeStyle='rgba(200,230,255,.85)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-4,p.y+16*p.s);ctx.stroke();p.y+=15*p.s;p.x-=1.5;if(p.y>H2){p.y=-20;p.x=Math.random()*W}}
      else if(mode==='snowy'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,3+p.s*3,0,6.283);ctx.fill();p.y+=1.6*p.s;p.x+=Math.sin(t+p.p)*.7;if(p.y>H2){p.y=-10;p.x=Math.random()*W}}
      else if(mode==='windy'){ctx.font='34px serif';ctx.fillText('🍃',p.x,p.y);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x-70,p.y+10);ctx.lineTo(p.x-14,p.y+10);ctx.stroke();p.x+=11*p.s;p.y+=Math.sin(t*2+p.p)*1.5;if(p.x>W+40){p.x=-90;p.y=Math.random()*H2}}
    });
  }
  function set(m,speak){
    mode=m;sc.className='scene wx m-'+m;Object.keys(btns).forEach(function(k){btns[k].classList.toggle('on',k===m)});
    stopAmb();clearInterval(timer);seed();
    if(m==='rainy')stopAmb=ambient('rain');else if(m==='windy')stopAmb=ambient('wind');else stopAmb=function(){};
    if(m==='sunny')timer=setInterval(sfx.chirp,2500);
    if(m==='snowy')timer=setInterval(function(){tone(1200+Math.random()*600,.5,'sine',.06,0,900)},900);
    if(speak){var s=tx(M.filter(function(x){return x[0]===m})[0][2]);say(s);replay=function(){say(s)}}
  }
  resize();window.addEventListener('resize',resize);frame();
  onLeave(function(){cancelAnimationFrame(raf);window.removeEventListener('resize',resize);stopAmb();clearInterval(timer)});
  set('sunny',false);var intro=tx(['Touch a picture to change the weather!','तस्वीर को छुओ, मौसम बदल जाएगा!']);say(intro);replay=function(){say(intro)};
}};

showStars();
try{if('speechSynthesis' in window)speechSynthesis.getVoices()}catch(e){}
go(null);
})();
</script>
